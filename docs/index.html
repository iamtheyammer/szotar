<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szótár — English ↔ Hungarian Wiktionary</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<!-- Home Screen: short label under the icon, and launch without Safari chrome -->
<meta name="apple-mobile-web-app-title" content="Szótár">
<meta name="application-name" content="Szótár">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edeee7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Two-ink dictionary system.
     Hungarian = paprika ink, English = prussian ink.
     The active language drives --accent everywhere.
     ============================================================ */
  :root{
    --paper:#edeee7;
    --card:#f7f7f2;
    --ink:#191f1c;
    --muted:#6a6a5e;
    --faint:#9a9a8c;
    --rule:#d6d7cc;
    --rule-soft:#e2e3d9;
    --ink-hu:#9a2617;   /* paprika / oxblood */
    --ink-en:#254a6e;   /* prussian slate  */
    --accent:var(--ink-hu);
    --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
    --serif:"Newsreader", Georgia, serif;
    --sans:"IBM Plex Sans", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    --maxw:1120px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* faint laid-paper texture, very subtle */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(25,31,28,.014) 27px 28px);
  }
  .wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ---------- masthead ---------- */
  header.masthead{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
  }
  .masthead .wrap{display:flex;align-items:center;gap:24px;padding-top:16px;padding-bottom:16px}
  .brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;text-decoration:none;color:var(--ink)}
  .brand .mark{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em}
  .brand .mark .a-hu{color:var(--ink-hu)}
  .brand .mark .a-en{color:var(--ink-en)}
  .brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  @media(max-width:640px){.brand .sub{display:none}}

  /* ---------- search ---------- */
  .search{position:relative;flex:1 1 auto;max-width:560px;margin-left:auto}
  .search-field{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--rule);border-radius:2px;padding:10px 14px;transition:border-color .15s,box-shadow .15s}
  .search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-field.dir-hu{border-color:var(--ink-hu)}
  .search-field.dir-hu:focus-within{border-color:var(--ink-hu);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--ink-hu) 12%, transparent)}
  .search-field.dir-en{border-color:var(--ink-en)}
  .search-field.dir-en:focus-within{border-color:var(--ink-en);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--ink-en) 12%, transparent)}
  .search-field svg{flex:0 0 auto;color:var(--muted)}
  #q{border:0;outline:0;background:transparent;font-family:var(--serif);font-size:19px;color:var(--ink);width:100%}
  #q::placeholder{color:var(--faint);font-style:italic}
  .clear-q{display:none;flex:0 0 auto;align-items:center;justify-content:center;
    background:none;border:0;padding:2px;cursor:pointer;color:var(--faint)}
  .clear-q:hover{color:var(--accent)}
  @media(max-width:640px){
    .clear-q.show{display:inline-flex}
  }
  .dir-badge{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
    border:1px solid var(--rule);border-radius:2px;padding:3px 6px;white-space:nowrap;
    background:none;cursor:pointer;transition:color .12s,border-color .12s,background .12s}
  .dir-badge:hover{border-color:var(--accent);color:var(--accent)}
  .dir-badge.active{color:#fff}
  .dir-badge.active.hu{background:var(--ink-hu);border-color:var(--ink-hu)}
  .dir-badge.active.en{background:var(--ink-en);border-color:var(--ink-en)}
  .dir-badge.active.hu:hover{border-color:var(--ink-hu);color:#fff}
  .dir-badge.active.en:hover{border-color:var(--ink-en);color:#fff}

  .suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);
    border:1px solid var(--rule);border-radius:2px;box-shadow:0 12px 30px rgba(25,31,28,.10);
    overflow:hidden;display:none;z-index:50}
  .suggest.open{display:block}
  .suggest button{display:flex;width:100%;align-items:baseline;gap:10px;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:9px 14px;cursor:pointer;color:var(--ink)}
  .suggest button:last-child{border-bottom:0}
  .suggest button:hover,.suggest button.active{background:var(--accent-soft)}
  .suggest .term{font-family:var(--serif);font-size:17px}
  .suggest .desc{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
  .suggest .desc-external{color:var(--accent)}

  /* ---------- layout ---------- */
  main .wrap{display:grid;grid-template-columns:220px 1fr;gap:40px;padding-top:36px;padding-bottom:80px;align-items:start}
  @media(max-width:820px){main .wrap{grid-template-columns:1fr;gap:24px}}

  aside.history{position:sticky;top:96px}
  @media(max-width:820px){aside.history{position:static;order:2;border-top:1px solid var(--rule);padding-top:20px}}
  .history h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);font-weight:500;margin:0 0 12px}
  .history ol{list-style:none;margin:0;padding:0}
  .history li{margin:0}
  .history button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
    padding:5px 0;cursor:pointer;color:var(--muted);font-family:var(--serif);font-size:16px;
    border-bottom:1px solid transparent;transition:color .12s}
  .history button:hover{color:var(--ink)}
  .history button .lang{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:1px 4px;border-radius:2px;color:#fff;flex:0 0 auto}
  .history .lang.hu{background:var(--ink-hu)}
  .history .lang.en{background:var(--ink-en)}
  .history .empty{color:var(--faint);font-style:italic;font-size:15px}
  .history .clear{margin-top:14px;font-family:var(--sans);font-size:12px;color:var(--faint);
    background:none;border:0;cursor:pointer;padding:0}
  .history .clear:hover{color:var(--ink-hu);text-decoration:underline}
  .fav-section{margin-bottom:28px}
  .history li.fav-item{display:flex;align-items:center;gap:2px}
  .history li.fav-item button:first-child{width:auto;flex:1 1 0%;min-width:0;overflow:hidden}
  .history li.fav-item button:first-child span.lang{margin-right:8px}
  .fav-word-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .history .fav-remove{width:auto;flex:0 0 auto;background:none;border:0;cursor:pointer;color:var(--faint);
    font-size:14px;line-height:1;padding:2px 2px}
  .fav-remove:hover{color:var(--ink-hu)}

  /* ---------- empty / hero state ---------- */
  .hero{grid-column:1/-1;text-align:center;padding:8vh 0 6vh}
  .hero .lede{font-family:var(--serif);font-size:clamp(30px,5vw,52px);line-height:1.1;letter-spacing:-.015em;margin:0 auto;max-width:14ch}
  .hero .lede .hu{color:var(--ink-hu)}
  .hero .lede .en{color:var(--ink-en)}
  .hero p{font-family:var(--sans);color:var(--muted);font-size:15px;margin:22px auto 0;max-width:46ch}
  .seeds{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .seeds button{font-family:var(--serif);font-size:17px;background:var(--card);border:1px solid var(--rule);
    border-radius:2px;padding:8px 14px;cursor:pointer;color:var(--ink);transition:border-color .12s,color .12s}
  .seeds button:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- entry card ---------- */
  .entry-wrap{min-width:0}
  .crumbs{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:22px;flex-wrap:wrap}
  .crumbs button{font-family:var(--sans);font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
  .crumbs button:hover{color:var(--ink)}
  .crumbs .back{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:500}
  .crumbs .sep{color:var(--faint)}
  .crumbs .cur{color:var(--ink);font-family:var(--serif);font-style:italic}

  .entry{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:2px;
    padding:34px 40px 34px;overflow:hidden}
  @media(max-width:560px){.entry{padding:26px 22px}}
  /* thumb tab — the signature: the language index tab of a physical dictionary */
  .thumbtab{position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--accent);transition:background .4s ease}
  .thumbtab .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(180deg);
    writing-mode:vertical-rl;font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:#fff;
    text-transform:uppercase;white-space:nowrap}
  .entry-body{padding-left:14px}

  .lang-toggle{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .lang-toggle button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    background:none;border:1px solid var(--rule);border-radius:2px;padding:5px 10px;cursor:pointer;color:var(--muted)}
  .lang-toggle button.on{color:#fff}
  .lang-toggle button.on.hu{background:var(--ink-hu);border-color:var(--ink-hu)}
  .lang-toggle button.on.en{background:var(--ink-en);border-color:var(--ink-en)}

  .headword{font-family:var(--serif);font-weight:500;font-size:clamp(38px,6vw,58px);line-height:1;
    letter-spacing:-.02em;margin:0;color:var(--ink)}
  .headword .accent{color:var(--accent)}
  .headline-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .ipa{font-family:var(--mono);font-size:16px;color:var(--muted)}
  .lang-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .wiki-link{font-family:var(--sans);font-size:12.5px;color:var(--muted);text-decoration:none;
    border-bottom:1px solid var(--rule)}
  .wiki-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .hrow-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
  .fav-btn{font-size:19px;line-height:1;background:none;border:0;cursor:pointer;color:var(--faint);
    padding:0;transition:color .12s,transform .1s}
  .fav-btn:hover{color:var(--accent);transform:scale(1.08)}
  .fav-btn.on{color:var(--accent)}

  .pos-block{margin-top:30px}
  .pos-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:16px}
  .pos-en{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink)}
  .pos-hu{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);
    border:1px solid var(--accent);border-radius:2px;padding:2px 6px}

  ol.senses{list-style:none;counter-reset:sense;margin:0;padding:0}
  ol.senses>li{position:relative;counter-increment:sense;padding:0 0 4px 40px;margin-bottom:16px}
  ol.senses>li::before{content:counter(sense);position:absolute;left:0;top:1px;font-family:var(--mono);
    font-size:13px;color:var(--accent);width:26px;text-align:right;padding-right:4px;
    border-right:2px solid var(--accent-soft)}
  .gloss{font-family:var(--serif);font-size:19px;line-height:1.5}
  .sense-label{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;
    color:var(--muted);margin-right:6px;font-weight:500}
  .paren{color:var(--muted)}
  .paren .paren-body{font-style:italic}

  /* examples — italic, indented, ink-tinted rule, print-dictionary style */
  .examples{margin:12px 0 4px;padding-left:2px;border-left:2px solid var(--rule-soft)}
  .examples .ex{padding:4px 0 4px 14px}
  .examples .ex .src{font-family:var(--serif);font-style:italic;color:var(--ink)}
  .examples .ex .tr{display:block;font-family:var(--serif);font-size:16px;color:var(--muted);margin-top:2px}
  .examples-caption{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);padding-left:14px;margin-bottom:2px}

  /* translations / possessive / conjugation panels */
  details.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    padding:12px 0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel .tri{transition:transform .2s;color:var(--faint)}
  details.panel[open]>summary .tri{transform:rotate(90deg)}
  details.panel.panel-lead{margin-bottom:26px;border-bottom:1px solid var(--rule);padding-bottom:6px}
  details.panel.panel-trail{margin-top:26px;border-top:1px solid var(--rule);padding-top:6px}
  .trans-group{margin:2px 0 16px;text-align:center}
  .trans-group .g-gloss{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-bottom:6px}
  .trans-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{font-family:var(--serif);font-size:17px;background:none;border:1px solid var(--ink-hu);color:var(--ink-hu);
    border-radius:2px;padding:5px 11px;cursor:pointer;transition:background .12s,color .12s}
  .chip:hover{background:var(--ink-hu);color:#fff}

  /* per-sense synonyms (always visible) */
  .syn-row{margin:6px 0 0;font-family:var(--sans);font-size:13px;color:var(--muted)}
  .syn-row .syn-label{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:var(--faint);margin-right:6px}

  /* embedded Wiktionary inflection tables (possessive forms, conjugation) */
  .mw-parser-output{
    --wikt-palette-paleblue:#eef2ee; --wikt-palette-grey:var(--rule); --wikt-palette-grey-6:var(--rule);
    --wikt-palette-grey-9:var(--muted); --wikt-palette-white:var(--card); --wikt-palette-lightergrey:var(--rule-soft);
    --wikt-palette-green-0:#eef4ee; --wikt-palette-green-1:#e3ede3; --wikt-palette-green-2:#d3e4d3;
    --wikt-palette-green-4:#bcd8bc; --wikt-palette-grey-green-1:var(--rule-soft);
    font-family:var(--sans); font-size:13.5px; color:var(--ink); overflow-x:auto;
  }
  .mw-parser-output caption{font-family:var(--serif);font-style:italic;text-align:left!important}

  /* click-to-define targets inside rendered content */
  .cd{cursor:pointer;color:inherit;background:none;border:0;padding:0;font:inherit;
    border-bottom:1px solid transparent;transition:border-color .12s,color .12s}
  .cd:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .cd.wl{color:var(--accent);border-bottom:1px solid var(--accent-soft)}   /* explicit wikilink */
  .cd.wl:hover{border-bottom-color:var(--accent)}

  /* states */
  .notice{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:28px 32px}
  .notice h3{font-family:var(--serif);font-size:24px;margin:0 0 8px}
  .notice p{font-family:var(--sans);font-size:14.5px;color:var(--muted);margin:0 0 16px}
  .did-you{display:flex;flex-wrap:wrap;gap:8px}
  .did-you button{font-family:var(--serif);font-size:16px;background:none;border:1px solid var(--rule);
    border-radius:2px;padding:5px 11px;cursor:pointer;color:var(--ink)}
  .did-you button:hover{border-color:var(--accent);color:var(--accent)}
  .loading{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--sans);font-size:14px;padding:24px 0}
  .spinner{width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lemma-note{margin-top:14px;font-family:var(--sans);font-size:13.5px;color:var(--muted)}
  .case-note{margin-top:12px;font-family:var(--sans);font-size:13px;color:var(--faint);font-style:italic}
  .lemma-note button{font-family:var(--serif);font-size:16px;color:var(--ink-hu);background:none;border:0;
    border-bottom:1px solid var(--accent-soft);cursor:pointer;padding:0}
  .lemma-note button:hover{border-bottom-color:var(--ink-hu)}
  .retry-btn{font-family:var(--serif);font-size:16px;background:none;border:1px solid var(--rule);
    border-radius:2px;padding:6px 14px;cursor:pointer;color:var(--ink)}
  .retry-btn:hover{border-color:var(--accent);color:var(--accent)}

  footer{border-top:1px solid var(--rule)}
  footer .wrap{padding:20px 24px;font-family:var(--sans);font-size:12px;color:var(--faint);
    display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{color:var(--ink-hu)}

  .fade-in{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#" onclick="App.home();return false" aria-label="Szótár home">
      <span class="mark">Sz<span class="a-hu">ó</span>t<span class="a-en">á</span>r</span>
      <span class="sub">EN&nbsp;↔&nbsp;HU · Wiktionary</span>
    </a>
    <div class="search">
      <div class="search-field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Keress egy szót…  ·  look up a word…"
          aria-label="Search a word in English or Hungarian">
        <button type="button" class="clear-q" id="clearQ" aria-label="Clear search" title="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button type="button" class="dir-badge" id="dirBadge">EN ↔ HU</button>
      </div>
      <div class="suggest" id="suggest" role="listbox"></div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <aside class="history">
      <div class="fav-section">
        <h2>Kedvencek · Favorites</h2>
        <ol id="favList"><li class="empty">No favorites yet.</li></ol>
      </div>
      <div class="hist-section">
        <h2>Előzmények · History</h2>
        <ol id="historyList"><li class="empty">No lookups yet.</li></ol>
        <button class="clear" id="clearHist" style="display:none">clear history</button>
      </div>
    </aside>

    <div class="entry-wrap" id="stage"><!-- hero / results render here --></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Data from <a href="https://wiktionary.org" target="_blank" rel="noopener">Wiktionary</a> · CC BY-SA. Not affiliated with Wikimedia.</span>
    <span>Built by <a href="https://github.com/iamtheyammer" target="_blank" rel="noopener">iamtheyammer</a>. <a href="https://github.com/iamtheyammer/szotar" target="_blank" rel="noopener">Contribute</a> on GitHub.</span>
  </div>
</footer>

<script>
"use strict";
/* ============================================================================
   DATA LAYER  —  everything that talks to Wiktionary lives behind this object.
   To move to a local kaikki.org dataset (v2), implement the same methods on a
   new provider and swap the `Provider` assignment below. Nothing else in the
   UI touches the network.
   ============================================================================ */
const LiveWiktionaryProvider = {
  BASE: "https://en.wiktionary.org",

  // Structured senses + examples, keyed by language code. HU headword => English glosses.
  async define(word){
    const url = `${this.BASE}/api/rest_v1/page/definition/${encodeURIComponent(word)}`;
    const r = await fetch(url);
    if(r.status === 404) return null;
    if(!r.ok) throw new Error("define "+r.status);
    return r.json();  // { "hu":[...], "en":[...], ... }
  },

  // Autocomplete. Returns array of {title}. When `lang` is "hu" or "en", results
  // are restricted to headwords actually categorized in that language (so a fixed
  // search direction doesn't surface suggestions from the other language).
  async suggest(prefix, lang){
    if(lang==="hu" || lang==="en"){
      const cat = lang==="hu" ? "Hungarian lemmas" : "English lemmas";
      const safe = prefix.replace(/["*]/g,"");
      const p = new URLSearchParams({action:"query",list:"search",
        srsearch:`intitle:${safe}* incategory:"${cat}"`,
        srlimit:"8",srnamespace:"0",format:"json",origin:"*"});
      const r = await fetch(`${this.BASE}/w/api.php?`+p);
      if(!r.ok) return [];
      const data = await r.json();
      const results = (data && data.query && data.query.search) || [];
      return results.map(x=>({title:x.title}));
    }
    const p = new URLSearchParams({action:"opensearch",search:prefix,limit:"8",
      namespace:"0",format:"json",origin:"*"});
    const r = await fetch(`${this.BASE}/w/api.php?`+p);
    if(!r.ok) return [];
    const data = await r.json();
    const titles = Array.isArray(data) ? (data[1]||[]) : [];
    return titles.map(t=>({title:t}));
  },

  // Raw wikitext — used to pull IPA and the EN→HU translation table.
  async wikitext(word){
    const p = new URLSearchParams({action:"parse",page:word,prop:"wikitext",
      redirects:"1",format:"json",origin:"*"});
    const r = await fetch(`${this.BASE}/w/api.php?`+p);
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.parse && j.parse.wikitext) ? j.parse.wikitext["*"] : null;
  },

  // Rendered page HTML — used to pull synonym lines and the Declension/Conjugation
  // tables, since those are template-expanded and don't exist in raw wikitext.
  async pageHtml(word){
    const p = new URLSearchParams({action:"parse",page:word,prop:"text",
      redirects:"1",format:"json",origin:"*"});
    const r = await fetch(`${this.BASE}/w/api.php?`+p);
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.parse && j.parse.text) ? j.parse.text["*"] : null;
  }
};
const Provider = LiveWiktionaryProvider;   // <-- swap here for a v2 local dataset

/* ------------------------------------------------------------------ helpers */
const HU_DIACRITICS = /[áéíóöőúüűÁÉÍÓÖŐÚÜŰ]/;
const DIR_ORDER = ["auto","hu","en"];
const DIR_LABEL = {auto:"EN ↔ HU", hu:"HU → EN", en:"EN → HU"};
const POS_HU = {  // English POS -> Hungarian abbreviation (learner aid)
  "Noun":"fn", "Proper noun":"tul", "Verb":"ige", "Adjective":"mn",
  "Adverb":"hsz", "Numeral":"szn", "Pronoun":"nm", "Conjunction":"ksz",
  "Postposition":"nu", "Preposition":"elölj", "Interjection":"isz",
  "Determiner":"det", "Particle":"part", "Article":"név",
  "Suffix":"képző", "Prefix":"igekötő"
};
function titleFromHref(href){
  if(!href) return null;
  let t = href.replace(/^\/wiki\//,"").split("#")[0];
  try{ t = decodeURIComponent(t); }catch(e){}
  t = t.replace(/_/g," ").trim();
  return t || null;
}
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

// Non-dictionary Wiktionary namespaces (Category, Appendix, etc.) — these aren't
// words with definitions, so we never try to render them inline; we hand off to
// the real site instead.
const SPECIAL_NS_RE = /^(Category|Appendix|Wiktionary|Thesaurus|Index|Reconstruction|Rhymes|Citations|Concordance|Talk|User|Template|Module|Help|Special|MediaWiki|File)\s*:/i;
function specialNamespace(title){
  const m = SPECIAL_NS_RE.exec((title||"").trim());
  return m ? m[1] : null;
}
function openOnWiktionary(title){
  window.open(`https://en.wiktionary.org/wiki/${encodeURIComponent(title.trim())}`, "_blank", "noopener");
}
// Sets the search box value programmatically (history/drill-down/etc.) and
// keeps the mobile clear-button's visibility in sync, since a plain .value
// assignment doesn't fire an "input" event.
function setSearchValue(v){
  document.getElementById("q").value = v;
  const btn = document.getElementById("clearQ");
  if(btn) btn.classList.toggle("show", v.length>0);
}

// Turn a plain-text run into individually clickable word tokens.
function tokenize(text, into){
  const parts = text.split(/(\s+|[.,;:!?()"“”«»…]+)/);
  for(const part of parts){
    if(!part) continue;
    if(/^[A-Za-zÀ-ÿ'’-]{2,}$/.test(part)){
      const b = el("button","cd",part);
      b.dataset.word = part;
      into.appendChild(b);
    } else {
      into.appendChild(document.createTextNode(part));
    }
  }
}

/* Rebuild Wiktionary's Parsoid definition HTML into safe, click-to-define DOM.
   - <a rel=mw:WikiLink href=/wiki/X> becomes a lookup button for X (the API
     hands us the exact headwords — this is what makes click-to-define reliable)
   - mention-gloss parentheticals get styled as a quiet parenthetical
   - usage labels ("rail transport") become small-caps sense labels
   - every other word becomes an individually clickable token                */
function renderDefinitionHTML(html){
  const out = el("span","gloss");
  const doc = new DOMParser().parseFromString(html, "text/html");
  const walk = (node, target) => {
    node.childNodes.forEach(ch=>{
      if(ch.nodeType === Node.TEXT_NODE){ tokenize(ch.textContent, target); return; }
      if(ch.nodeType !== Node.ELEMENT_NODE) return;
      const tag = ch.tagName.toLowerCase();
      const cls = ch.getAttribute("class")||"";
      if(tag==="a"){
        const word = titleFromHref(ch.getAttribute("href"));
        if(word && (ch.getAttribute("rel")||"").includes("WikiLink")){
          const b = el("button","cd wl",ch.textContent); b.dataset.word = word;
          target.appendChild(b);
        } else { tokenize(ch.textContent, target); }
        return;
      }
      if(cls.includes("usage-label-sense")){
        const t = ch.textContent.trim();
        if(t) target.appendChild(el("span","sense-label",t.replace(/[()]/g,"")));
        return;
      }
      if(cls.includes("mention-gloss-paren")){
        target.appendChild(el("span","paren",ch.textContent)); return;
      }
      if(cls.includes("mention-gloss")){
        const s = el("span","paren"); const inner = el("span","paren-body");
        walk(ch, inner); s.appendChild(inner); target.appendChild(s); return;
      }
      walk(ch, target);   // default: descend
    });
  };
  walk(doc.body, out);
  return out;
}

/* Extract from raw wikitext: the Hungarian IPA (when literally present) and the
   English-section translations into Hungarian, grouped by sense gloss.        */
function parseWikitext(wt){
  const res = { ipa:null, trans:[] };
  if(!wt) return res;

  // IPA: literal {{IPA|hu|/.../}} only. {{hu-IPA}} is module-generated (not in
  // the wikitext), so we omit IPA in that case (a v2 improvement is to scrape it).
  const ipaM = wt.match(/\{\{IPA\|hu\|([^|}]+)/);
  if(ipaM) res.ipa = ipaM[1].trim();

  // Translations live under the English language section only.
  const enStart = wt.search(/\n==\s*English\s*==/);
  if(enStart !== -1){
    let enChunk = wt.slice(enStart+1);
    const next = enChunk.slice(4).search(/\n==[^=]/);   // next top-level lang header
    if(next !== -1) enChunk = enChunk.slice(0, next+4);

    const groupRe = /\{\{trans-top\|?([^}]*)\}\}([\s\S]*?)\{\{trans-bottom\}\}/g;
    let g, found=false;
    while((g = groupRe.exec(enChunk))){
      found = true;
      const gloss = (g[1]||"").replace(/^\d+=/,"").trim();
      const words = collectHu(g[2]);
      if(words.length) res.trans.push({gloss, words});
    }
    if(!found){
      const words = collectHu(enChunk);
      if(words.length) res.trans.push({gloss:"", words});
    }
  }
  return res;
}
function collectHu(text){
  const out = [], seen = new Set();
  const re = /\{\{tt?\+?\|hu\|([^|}]+)/g;   // {{t|hu|..}} {{t+|hu|..}} {{tt+|hu|..}}
  let m;
  while((m = re.exec(text))){
    const w = m[1].trim();
    if(w && !seen.has(w)){ seen.add(w); out.push(w); }
  }
  return out;
}

// A Hungarian entry that is only an inflected form points at its lemma.
function detectLemma(langBlocks){
  for(const b of (langBlocks||[])){
    for(const d of (b.definitions||[])){
      const html = d.definition||"";
      const plain = html.replace(/<[^>]+>/g,"");
      if(/inflection of|form of|singular of|plural of|nominative|accusative|comparative of/i.test(plain)){
        const m = html.match(/href="\/wiki\/([^"#]+)/);
        if(m){ let t=m[1]; try{t=decodeURIComponent(t);}catch(e){} return t.replace(/_/g," "); }
      }
    }
  }
  return null;
}

// Clone a node out of the Parsoid HTML doc into ours, stripping embedded
// stylesheets/edit-section links and turning its wikilinks into click-to-define buttons.
function sanitizeWikiFragment(node){
  const clone = document.importNode(node, true);
  clone.querySelectorAll("style,link,.mw-editsection").forEach(e=>e.remove());
  clone.querySelectorAll("a[href]").forEach(a=>{
    const word = titleFromHref(a.getAttribute("href"));
    if(word){
      const btn = document.createElement("button");
      btn.className = "cd wl";
      btn.textContent = a.textContent;
      btn.dataset.word = word;
      a.replaceWith(btn);
    }
  });
  return clone;
}

/* Extract from the fully-rendered page HTML (Parsoid can't give us these —
   they're template-expanded): per-sense synonym lists, the Hungarian
   possessive-forms table, and the Hungarian conjugation table(s).            */
function parseRenderedExtras(html){
  const out = { hu:{synByPos:{}, possessive:null, conjugation:[], styleCSS:""}, en:{synByPos:{}} };
  if(!html) return out;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const styleEl = doc.querySelector("style[data-mw-deduplicate]");
  if(styleEl) out.hu.styleCSS = styleEl.textContent;

  const root = doc.querySelector(".mw-parser-output") || doc.body;
  let curLang=null, curPOS=null, curSub=null;
  Array.from(root.children).forEach(node=>{
    const cls = node.classList;
    if(cls.contains("mw-heading2")){
      const h = node.querySelector("h2");
      const t = h ? h.textContent.trim() : "";
      curLang = t==="Hungarian" ? "hu" : t==="English" ? "en" : null;
      curPOS=null; curSub=null; return;
    }
    if(!curLang) return;
    if(cls.contains("mw-heading3")||cls.contains("mw-heading4")||cls.contains("mw-heading5")){
      const h = node.querySelector("h3,h4,h5");
      const t = h ? h.textContent.trim() : "";
      if(POS_HU.hasOwnProperty(t)){
        curPOS=t; curSub=null;
        if(!out[curLang].synByPos[t]) out[curLang].synByPos[t]=[];
      } else if(t==="Declension" || t==="Conjugation"){
        curSub=t;
      } else { curSub=null; }
      return;
    }
    if(curPOS && !curSub && node.tagName==="OL"){
      out[curLang].synByPos[curPOS] = Array.from(node.children).map(li=>{
        const words=[];
        li.querySelectorAll(":scope > dl > dd > span.nyms.synonym a").forEach(a=>{
          const w=a.textContent.trim(); if(w) words.push(w);
        });
        return words;
      });
      return;
    }
    if(curLang==="hu" && curSub==="Declension" && cls.contains("inflection-table-wrapper")){
      const cap = node.querySelector("caption");
      if(cap && /possessive forms/i.test(cap.textContent)) out.hu.possessive = sanitizeWikiFragment(node);
      return;
    }
    if(curLang==="hu" && curSub==="Conjugation" && cls.contains("inflection-table-wrapper")){
      out.hu.conjugation.push(sanitizeWikiFragment(node));
    }
  });
  return out;
}

// Everything one lookup needs, fetched together.
function fetchWord(word){
  return Promise.all([
    Provider.define(word),
    Provider.wikitext(word).catch(()=>null),
    Provider.pageHtml(word).catch(()=>null)
  ]).then(([def, wt, rhtml])=>({def, wt, rhtml}));
}

// Does this definition payload actually give us something to show? With a fixed
// search direction the word must exist in that specific language — we don't
// silently fall back to showing it in the other one.
function hasUsableEntry(def, forceLang){
  if(!def || Object.keys(def).length===0) return false;
  if(forceLang) return !!(def[forceLang] && def[forceLang].length);
  return true;
}

/* ============================================================================
   APP  —  state, routing, rendering
   ============================================================================ */
const App = {
  stack: [],
  history: loadHist(),
  favorites: loadFav(),
  dir: loadDir(),   // "auto" | "hu" | "en" — fixed search direction, remembered
  reqId: 0,
  forceLang: null,

  home(){
    this.stack = [];
    setSearchValue("");
    setAccent("hu");
    renderHero();
    closeSuggest();
    history.replaceState(null, "", location.pathname + location.hash);
  },

  async lookup(word, opts){
    opts = opts||{};
    word = (word||"").trim();
    if(!word) return;
    closeSuggest();
    const ns = specialNamespace(word);
    if(ns){ openOnWiktionary(word); return; }
    setSearchValue(word);
    if(opts.drill) this.stack.push(word); else this.stack = [word];
    this.forceLang = opts.lang || null;

    const my = ++this.reqId;
    renderLoading(word);

    // Wiktionary's mainspace is case-sensitive — "Ház" and "ház" are different
    // pages, and a capitalised query (start of a sentence, a proper-noun guess)
    // often has no page of its own. Try exactly what was asked for first, then
    // fall back to the lowercased form.
    const lower = word.toLowerCase();
    const candidates = lower !== word ? [word, lower] : [word];

    let hit = null, resolved = word;
    for(const cand of candidates){
      let r;
      try{
        r = await fetchWord(cand);
      }catch(e){
        if(my===this.reqId) renderError(word, e);
        return;
      }
      if(my !== this.reqId) return;   // a newer lookup superseded this one
      if(hasUsableEntry(r.def, this.forceLang)){ hit = r; resolved = cand; break; }
    }
    if(!hit){ renderNotFound(word); return; }

    // Re-point the UI at the headword we actually found.
    const fellBack = resolved !== word;
    if(fellBack){
      setSearchValue(resolved);
      if(this.stack.length) this.stack[this.stack.length-1] = resolved;
    }

    const parsed = parseWikitext(hit.wt);
    const extras = parseRenderedExtras(hit.rhtml);
    const lang = chooseLang(hit.def);
    pushHist(resolved, lang);
    updateURL(resolved, lang);
    renderEntry(resolved, hit.def, parsed, extras, fellBack ? word : null);
  }
};

// Which language section leads, given the word's script and what's available.
function chooseLang(def){
  const langs = Object.keys(def);
  const hasHu = langs.includes("hu"), hasEn = langs.includes("en");
  if(App.forceLang && langs.includes(App.forceLang)) return App.forceLang;
  if(hasHu && !hasEn) return "hu";
  if(hasEn && !hasHu) return "en";
  if(hasHu && hasEn){
    const w = document.getElementById("q").value;
    return HU_DIACRITICS.test(w) ? "hu" : "en";
  }
  return langs[0];
}

// Keep the URL in sync with the current entry (query param only, no new
// history entries) so a reload — or sharing the link — lands back here.
function updateURL(word, lang){
  const params = new URLSearchParams();
  params.set(lang==="hu" ? "huen" : "enhu", word);
  history.replaceState(null, "", location.pathname + "?" + params + location.hash);
}

function setAccent(lang){
  document.documentElement.style.setProperty("--accent",
    lang==="en" ? "var(--ink-en)" : "var(--ink-hu)");
}

/* -------------------------------------------------------------- dir toggle */
function loadDir(){
  try{
    const v = localStorage.getItem("szotar.dir");
    return DIR_ORDER.includes(v) ? v : "auto";
  }catch(e){ return "auto"; }
}
function saveDir(){ try{ localStorage.setItem("szotar.dir", App.dir); }catch(e){} }
function renderDirBadge(){
  const b = document.getElementById("dirBadge");
  b.textContent = DIR_LABEL[App.dir];
  b.classList.toggle("active", App.dir!=="auto");
  b.classList.toggle("hu", App.dir==="hu");
  b.classList.toggle("en", App.dir==="en");
  b.setAttribute("aria-label", "Search direction: "+DIR_LABEL[App.dir]+". Click to change.");
  b.title = "Click to change search direction";
  const field = document.querySelector(".search-field");
  field.classList.toggle("dir-hu", App.dir==="hu");
  field.classList.toggle("dir-en", App.dir==="en");
  // Hints mobile on-screen keyboards (notably Android/Gboard) to switch layout.
  document.getElementById("q").lang = App.dir==="hu" ? "hu" : "en";
}

/* ------------------------------------------------------------- render: hero */
function renderHero(){
  setAccent("hu");
  const s = document.getElementById("stage");
  s.className = "entry-wrap fade-in";
  s.innerHTML = "";
  const hero = el("div","hero");
  const lede = el("div","lede");
  lede.innerHTML = 'A cleaner <span class="en">English</span> &amp; <span class="hu">Magyar</span> interface for Wiktionary.';
  const p = el("p", null, "Type a word in either language. Hungarian entries show their English meaning; English entries show their Hungarian equivalents. Not all words are available. All data comes from Wiktionary, CC-BY-SA.");
  const seeds = el("div","seeds");
  ["pályaudvar","jönni","viszontlátásra","station","home","open"].forEach(w=>{
    const b = el("button",null,w); b.onclick=()=>App.lookup(w); seeds.appendChild(b);
  });
  hero.append(lede,p,seeds); s.appendChild(hero);
}

/* ---------------------------------------------------------- render: loading */
function renderLoading(word){
  const s = document.getElementById("stage");
  s.className="entry-wrap"; s.innerHTML="";
  renderCrumbs(s);
  const l = el("div","loading");
  l.append(el("span","spinner"), el("span",null,"Looking up “"+word+"”…"));
  s.appendChild(l);
}

/* ------------------------------------------------------------ render: crumbs */
function renderCrumbs(mount){
  const c = el("div","crumbs");
  if(App.stack.length>1){
    const back = el("button","back");
    back.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg> back';
    back.onclick = ()=>{ App.stack.pop(); const prev=App.stack.pop(); App.lookup(prev); };
    c.appendChild(back);
    App.stack.forEach((w,i)=>{
      if(i>0) c.appendChild(el("span","sep","›"));
      if(i===App.stack.length-1){ c.appendChild(el("span","cur",w)); }
      else{ const b=el("button",null,w); b.onclick=()=>{ App.stack=App.stack.slice(0,i); App.lookup(w,{drill:true}); }; c.appendChild(b); }
    });
  }
  mount.appendChild(c);
}

/* ------------------------------------------------------------- render: entry */
function renderEntry(word, def, parsed, extras, fallbackFrom){
  const primary = chooseLang(def);
  setAccent(primary);
  const s = document.getElementById("stage");
  s.className="entry-wrap fade-in"; s.innerHTML="";
  renderCrumbs(s);

  const langs = Object.keys(def).filter(l=>def[l]&&def[l].length);
  const ordered = [primary, ...langs.filter(l=>l!==primary)];
  let relevant = ordered.filter(l=>l==="hu"||l==="en");
  if(App.dir!=="auto") relevant = relevant.filter(l=>l===App.dir);
  const shown = relevant.length?relevant:[primary];

  const card = el("div","entry");
  const tab = el("div","thumbtab");
  tab.appendChild(el("span","txt", primary==="hu"?"Magyar":"English"));
  card.appendChild(tab);
  const body = el("div","entry-body");
  card.appendChild(body);

  if(shown.length>1){
    const tg = el("div","lang-toggle");
    shown.forEach(l=>{
      const b = el("button", l===primary?("on "+l):"", l==="hu"?"Magyar":"English");
      b.onclick = ()=>paintLang(l);
      tg.appendChild(b);
    });
    body.appendChild(tg);
  }

  const hrow = el("div","headline-row");
  const hw = el("h1","headword");
  const accSpan = el("span","accent",word); hw.appendChild(accSpan);
  hrow.appendChild(hw);
  if(parsed.ipa) hrow.appendChild(el("span","ipa", "/"+parsed.ipa.replace(/^\/|\/$/g,"")+"/"));
  hrow.appendChild(el("span","lang-name", primary==="hu"?"Hungarian":"English"));
  const wikiLink = document.createElement("a");
  wikiLink.className = "wiki-link"; wikiLink.target = "_blank"; wikiLink.rel = "noopener noreferrer";
  wikiLink.textContent = "Wiktionary ↗";
  wikiLink.href = `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}#${primary==="hu"?"Hungarian":"English"}`;

  const favBtn = document.createElement("button");
  favBtn.type = "button"; favBtn.className = "fav-btn";
  function paintFav(){
    const on = isFavorited(word);
    favBtn.classList.toggle("on", on);
    favBtn.textContent = on ? "★" : "☆";
    const label = on ? "Remove from favorites" : "Add to favorites";
    favBtn.setAttribute("aria-label", label); favBtn.title = label;
  }
  paintFav();
  favBtn.onclick = ()=>{ toggleFavorite(word, primary); paintFav(); };

  const actions = el("div","hrow-actions");
  actions.append(favBtn, wikiLink);
  hrow.appendChild(actions);
  body.appendChild(hrow);

  if(fallbackFrom){
    const note = el("div","case-note");
    note.textContent = "No entry for “"+fallbackFrom+"” — showing “"+word+"”.";
    body.appendChild(note);
  }

  const lemma = primary==="hu" ? detectLemma(def.hu) : null;
  if(lemma && lemma.toLowerCase()!==word.toLowerCase()){
    const note = el("div","lemma-note");
    note.append(document.createTextNode("Inflected form — see the lemma "));
    const b = el("button",null,lemma); b.onclick=()=>App.lookup(lemma,{drill:true});
    note.append(b); body.appendChild(note);
  }

  shown.forEach(l=>{
    const region = el("div","lang-region"); region.dataset.lang=l;
    if(l!==primary) region.style.display="none";
    renderLangBlocks(region, def[l], l, parsed, extras[l]);
    body.appendChild(region);
  });

  function paintLang(l){
    setAccent(l);
    tab.querySelector(".txt").textContent = l==="hu"?"Magyar":"English";
    hrow.querySelector(".lang-name").textContent = l==="hu"?"Hungarian":"English";
    wikiLink.href = `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}#${l==="hu"?"Hungarian":"English"}`;
    body.querySelectorAll(".lang-region").forEach(r=> r.style.display = r.dataset.lang===l?"":"none");
    body.querySelectorAll(".lang-toggle button").forEach(btn=>{
      const on = btn.textContent===(l==="hu"?"Magyar":"English");
      btn.className = on?("on "+l):"";
    });
    updateURL(word, l);
  }

  s.appendChild(card);
}

// Translations panel first (when present), then part-of-speech blocks with
// per-sense synonyms, then trailing possessive-forms/conjugation panels (hu only).
function renderLangBlocks(mount, blocks, lang, parsed, extra){
  extra = extra || {synByPos:{}};
  if(lang==="en" && parsed.trans && parsed.trans.length){
    const det = document.createElement("details"); det.className="panel panel-lead"; det.open=true;
    const sm = document.createElement("summary");
    sm.innerHTML = '<span class="tri">▸</span> Magyar megfelelők · Hungarian translations';
    det.appendChild(sm);
    parsed.trans.forEach(gr=>{
      const g = el("div","trans-group");
      if(gr.gloss) g.appendChild(el("div","g-gloss", gr.gloss));
      const chips = el("div","trans-chips");
      gr.words.forEach(w=>{ const c=el("button","chip",w); c.onclick=()=>App.lookup(w,{drill:true}); chips.appendChild(c); });
      g.appendChild(chips); det.appendChild(g);
    });
    mount.appendChild(det);
  }

  if(lang==="en" && !(parsed.trans && parsed.trans.length)){
    mount.appendChild(el("div","case-note","No Hungarian translation found for this word."));
  }
  const anySense = blocks.some(b=>(b.definitions||[]).some(d=>d.definition && d.definition.trim()));
  if(lang==="hu" && !anySense){
    mount.appendChild(el("div","case-note","No English translation found for this word."));
  }

  blocks.forEach(b=>{
    const pb = el("div","pos-block");
    const head = el("div","pos-head");
    head.appendChild(el("span","pos-en", b.partOfSpeech||"—"));
    const huAbbr = POS_HU[b.partOfSpeech];
    if(huAbbr) head.appendChild(el("span","pos-hu", huAbbr));
    pb.appendChild(head);

    const ol = el("ol","senses");
    const synList = extra.synByPos[b.partOfSpeech] || [];
    (b.definitions||[]).forEach((d,i)=>{
      if(!d.definition || !d.definition.trim()) return;
      const li = el("li");
      li.appendChild(renderDefinitionHTML(d.definition));
      const syns = synList[i];
      if(syns && syns.length){
        const sr = el("div","syn-row");
        sr.appendChild(el("span","syn-label", syns.length>1?"synonyms":"synonym"));
        syns.forEach((w,k)=>{
          if(k>0) sr.appendChild(document.createTextNode(", "));
          const btn = el("button","cd wl",w); btn.dataset.word=w;
          sr.appendChild(btn);
        });
        li.appendChild(sr);
      }
      const exs = d.parsedExamples || (d.examples||[]).map(e=>({example:e}));
      if(exs && exs.length){
        const box = el("div","examples");
        box.appendChild(el("div","examples-caption","példák · examples"));
        exs.forEach(ex=>{
          const row = el("div","ex");
          const src = el("span","src"); src.appendChild(renderInline(ex.example));
          row.appendChild(src);
          if(ex.translation){ const tr=el("span","tr"); tr.appendChild(renderInline(ex.translation)); row.appendChild(tr); }
          box.appendChild(row);
        });
        li.appendChild(box);
      }
      ol.appendChild(li);
    });
    pb.appendChild(ol);
    mount.appendChild(pb);
  });

  if(lang==="hu"){
    if(extra.possessive) mount.appendChild(buildWikiTablePanel("Birtokos alakok · Possessive forms", extra.styleCSS, [extra.possessive]));
    if(extra.conjugation && extra.conjugation.length) mount.appendChild(buildWikiTablePanel("Ragozás · Conjugation", extra.styleCSS, extra.conjugation));
  }
}

// A collapsed-by-default panel embedding one or more sanitized Wiktionary
// inflection tables, re-using Wiktionary's own (captured) table CSS.
function buildWikiTablePanel(label, styleCSS, nodes){
  const det = document.createElement("details"); det.className = "panel panel-trail wiki-embed";
  const sm = document.createElement("summary");
  sm.innerHTML = '<span class="tri">▸</span> '+label;
  det.appendChild(sm);
  const wrap = el("div","mw-parser-output");
  if(styleCSS){ const st = document.createElement("style"); st.textContent = styleCSS; wrap.appendChild(st); }
  nodes.forEach(n=>{ if(n) wrap.appendChild(n); });
  det.appendChild(wrap);
  return det;
}

// Inline HTML (examples) -> clickable tokens, reusing the definition renderer.
function renderInline(html){
  if(/[<>]/.test(html)) return renderDefinitionHTML(html);
  const span = el("span","gloss"); tokenize(html, span); return span;
}

/* --------------------------------------------------------- render: not found */
async function renderNotFound(word){
  const s = document.getElementById("stage");
  s.className="entry-wrap fade-in"; s.innerHTML="";
  renderCrumbs(s);
  const n = el("div","notice");
  n.appendChild(el("h3", null, "No entry for “"+word+"”."));
  n.appendChild(el("p", null, "Hungarian is agglutinative, so inflected forms (pályaudvarban, jönnék) often aren’t headwords. Try the base form, or pick a suggestion:"));
  const dy = el("div","did-you");
  n.appendChild(dy); s.appendChild(n);
  try{
    const sug = await Provider.suggest(word, App.dir!=="auto"?App.dir:undefined);
    if(sug.length){ sug.slice(0,8).forEach(o=>{ const b=el("button",null,o.title);
      b.onclick=()=>App.lookup(o.title, App.dir!=="auto"?{lang:App.dir}:undefined); dy.appendChild(b); }); }
    else dy.appendChild(el("p",null,"No close matches found."));
  }catch(e){ dy.appendChild(el("p",null,"Couldn’t reach suggestions.")); }
}

/* ------------------------------------------------------------ render: error */
function renderError(word, e){
  const s = document.getElementById("stage");
  s.className="entry-wrap"; s.innerHTML="";
  renderCrumbs(s);
  const n = el("div","notice");
  n.appendChild(el("h3", null, "Couldn’t reach Wiktionary."));
  n.appendChild(el("p", null, "The lookup for “"+word+"” failed. Check your connection and try again. If you’re running this inside a sandbox that blocks external requests, open the file directly in your browser instead."));
  const b = el("button","retry-btn","Retry"); b.onclick=()=>App.lookup(word);
  n.appendChild(b); s.appendChild(n);
  console.error(e);
}

/* ------------------------------------------------------------------ history */
function loadHist(){ try{ return JSON.parse(localStorage.getItem("szotar.hist")||"[]"); }catch(e){ return []; } }
function saveHist(){ try{ localStorage.setItem("szotar.hist", JSON.stringify(App.history.slice(0,60))); }catch(e){} }
function pushHist(word, lang){
  App.history = App.history.filter(h=>h.word.toLowerCase()!==word.toLowerCase());
  App.history.unshift({word, lang});
  saveHist(); renderHistory();
}
function renderHistory(){
  const ol = document.getElementById("historyList");
  const clear = document.getElementById("clearHist");
  ol.innerHTML="";
  if(!App.history.length){ ol.appendChild(el("li","empty","No lookups yet.")); clear.style.display="none"; return; }
  clear.style.display="";
  App.history.forEach(h=>{
    const li = el("li"); const b = el("button");
    const tag = el("span","lang "+(h.lang==="en"?"en":"hu"), h.lang==="en"?"EN":"HU");
    b.append(tag, document.createTextNode(h.word));
    b.onclick=()=>App.lookup(h.word);
    li.appendChild(b); ol.appendChild(li);
  });
}
document.getElementById("clearHist").onclick=()=>{ App.history=[]; saveHist(); renderHistory(); };

/* ------------------------------------------------------------------ favorites */
function loadFav(){ try{ return JSON.parse(localStorage.getItem("szotar.fav")||"[]"); }catch(e){ return []; } }
function saveFav(){ try{ localStorage.setItem("szotar.fav", JSON.stringify(App.favorites)); }catch(e){} }
function isFavorited(word){
  return App.favorites.some(f=>f.word.toLowerCase()===word.toLowerCase());
}
function toggleFavorite(word, lang){
  const idx = App.favorites.findIndex(f=>f.word.toLowerCase()===word.toLowerCase());
  if(idx>=0) App.favorites.splice(idx,1);
  else App.favorites.unshift({word, lang: lang||"hu"});
  saveFav(); renderFavorites();
}
function renderFavorites(){
  const ol = document.getElementById("favList");
  ol.innerHTML="";
  if(!App.favorites.length){ ol.appendChild(el("li","empty","No favorites yet.")); return; }
  App.favorites.forEach(f=>{
    const li = el("li","fav-item");
    const b = el("button");
    const tag = el("span","lang "+(f.lang==="en"?"en":"hu"), f.lang==="en"?"EN":"HU");
    const wordSpan = el("span","fav-word-text", f.word);
    b.append(tag, wordSpan);
    b.onclick=()=>App.lookup(f.word);
    const rm = el("button","fav-remove","★");
    rm.type="button"; rm.title="Remove from favorites"; rm.setAttribute("aria-label","Remove from favorites");
    rm.onclick=(e)=>{ e.stopPropagation(); toggleFavorite(f.word); };
    li.append(b, rm); ol.appendChild(li);
  });
}

/* --------------------------------------------------------------- search box */
const qInput = document.getElementById("q");
const suggestBox = document.getElementById("suggest");
const clearQBtn = document.getElementById("clearQ");
let sugTimer=null, sugItems=[], sugActive=-1;

qInput.addEventListener("input", ()=>{
  const v = qInput.value.trim();
  clearQBtn.classList.toggle("show", qInput.value.length>0);
  clearTimeout(sugTimer);
  if(v.length<1){ closeSuggest(); return; }
  sugTimer = setTimeout(async ()=>{
    try{
      const items = await Provider.suggest(v, App.dir!=="auto"?App.dir:undefined);
      sugItems = items; sugActive=-1; paintSuggest();
    }catch(e){ closeSuggest(); }
  }, 130);
});
clearQBtn.addEventListener("click", ()=>{
  qInput.value = "";
  clearQBtn.classList.remove("show");
  closeSuggest();
  qInput.focus();
});
function paintSuggest(){
  if(!sugItems.length){ closeSuggest(); return; }
  suggestBox.innerHTML="";
  sugItems.forEach((it,i)=>{
    const b = el("button");
    const ns = specialNamespace(it.title);
    b.appendChild(el("span","term", it.title));
    b.appendChild(el("span", "desc"+(ns?" desc-external":""),
      ns ? ns+" ↗ opens on Wiktionary" : (HU_DIACRITICS.test(it.title)?"Hungarian?":"")));
    if(i===sugActive) b.classList.add("active");
    b.onmousedown=(e)=>{ e.preventDefault(); App.lookup(it.title, App.dir!=="auto"?{lang:App.dir}:undefined); };
    suggestBox.appendChild(b);
  });
  suggestBox.classList.add("open");
}
function closeSuggest(){ suggestBox.classList.remove("open"); suggestBox.innerHTML=""; sugItems=[]; sugActive=-1; }

qInput.addEventListener("keydown",(e)=>{
  if(suggestBox.classList.contains("open") && sugItems.length){
    if(e.key==="ArrowDown"){ e.preventDefault(); sugActive=(sugActive+1)%sugItems.length; paintSuggest(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); sugActive=(sugActive-1+sugItems.length)%sugItems.length; paintSuggest(); return; }
    if(e.key==="Enter" && sugActive>=0){ e.preventDefault(); App.lookup(sugItems[sugActive].title, App.dir!=="auto"?{lang:App.dir}:undefined); return; }
    if(e.key==="Escape"){ closeSuggest(); return; }
  }
  if(e.key==="Enter"){ e.preventDefault(); if(qInput.value.trim()) App.lookup(qInput.value.trim(), App.dir!=="auto"?{lang:App.dir}:undefined); }
});
document.addEventListener("click",(e)=>{ if(!e.target.closest(".search")) closeSuggest(); });

/* -------------------------------------------------------------- dir toggle */
document.getElementById("dirBadge").addEventListener("click", ()=>{
  const i = DIR_ORDER.indexOf(App.dir);
  App.dir = DIR_ORDER[(i+1)%DIR_ORDER.length];
  saveDir(); renderDirBadge(); closeSuggest();
  if(App.stack.length) App.lookup(App.stack[App.stack.length-1], App.dir!=="auto"?{lang:App.dir}:undefined);
});

/* ----------------------------------------------- click-to-define delegation */
document.getElementById("stage").addEventListener("click",(e)=>{
  const t = e.target.closest(".cd");
  if(t && t.dataset.word){ App.lookup(t.dataset.word, {drill:true}); }
});

/* keyboard: "/" focuses search */
document.addEventListener("keydown",(e)=>{
  if(e.key==="/" && document.activeElement!==qInput){ e.preventDefault(); qInput.focus(); }
});

/* ------------------------------------------------------------------- start */
renderHistory();
renderFavorites();
renderDirBadge();
(function initFromURL(){
  const params = new URLSearchParams(location.search);
  const enhu = params.get("enhu");   // English word -> Hungarian translations
  const huen = params.get("huen");   // Hungarian word -> English definition
  if(huen) App.lookup(huen, {lang:"hu"});
  else if(enhu) App.lookup(enhu, {lang:"en"});
  else renderHero();
})();
</script>
